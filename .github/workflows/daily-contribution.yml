name: Daily Repository Maintenance

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update maintenance log
        run: |
          mkdir -p .github
          printf '%s\n' "- $(date -u '+%Y-%m-%d'): automated repository maintenance check" >> .github/maintenance-log.md

      - name: Commit and push
        run: |
          git add .github/maintenance-log.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily repository maintenance"
          git push